<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multilingual Love Heart</title>
  <style>
    :root {
      --bg1: #12071d;
      --bg2: #2b0c2a;
      --pink: #ff5ca8;
      --pink2: #ff9ad2;
      --purple: #a66cff;
      --white: #fff4fb;
      --glow: rgba(255, 92, 168, 0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 133, 196, 0.24), transparent 30%),
        radial-gradient(circle at 80% 30%, rgba(166, 108, 255, 0.18), transparent 35%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 50%, #180d1f);
      color: var(--white);
    }

    .scene {
      position: relative;
      width: min(90vw, 760px);
      height: min(85vh, 760px);
      display: grid;
      place-items: center;
    }

    .heart-shell {
      position: relative;
      width: 520px;
      height: 520px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 0 18px rgba(255, 92, 168, 0.3));
      animation: floaty 3.5s ease-in-out infinite;
    }

    .heart-shell::before {
      content: "";
      position: absolute;
      inset: 42px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.02)),
        rgba(255, 255, 255, 0.02);
      border: 2px solid rgba(255, 255, 255, 0.08);
      clip-path: polygon(
        50% 100%, 0% 56%, 0% 24%, 17% 8%, 35% 0%, 50% 17%,
        65% 0%, 83% 8%, 100% 24%, 100% 56%
      );
      border-radius: 40px;
      backdrop-filter: blur(2px);
    }

    .heart {
      position: relative;
      width: 440px;
      height: 440px;
      animation: pulse 1.8s ease-in-out infinite;
      z-index: 1;
    }

    .heart::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 245, 250, 0.35), rgba(255, 145, 200, 0.12) 30%, rgba(255, 92, 168, 0.08) 60%, transparent 75%);
      clip-path: polygon(
        50% 100%, 0% 56%, 0% 24%, 17% 8%, 35% 0%, 50% 17%,
        65% 0%, 83% 8%, 100% 24%, 100% 56%
      );
      pointer-events: none;
    }

    .word {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 2px 8px;
      font-size: clamp(10px, 1vw, 15px);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.96);
      text-shadow:
        0 0 12px rgba(255, 92, 168, 0.7),
        0 0 18px rgba(166, 108, 255, 0.6);
      white-space: nowrap;
      opacity: 0.9;
      animation:
        drift var(--dur, 3s) ease-in-out infinite,
        glowPulse 2.2s ease-in-out infinite alternate;
      animation-delay: var(--delay, 0s);
      will-change: transform, opacity;
      user-select: none;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.98); }
      20% { transform: scale(1.02); }
      40% { transform: scale(1); }
      60% { transform: scale(1.04); }
      80% { transform: scale(1); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    @keyframes drift {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(0.96); opacity: 0.8; }
      50% { transform: translate(-50%, -50%) rotate(var(--tilt, 8deg)) scale(1.1); opacity: 1; }
    }

    @keyframes glowPulse {
      0% { text-shadow: 0 0 10px rgba(255, 92, 168, 0.7), 0 0 18px rgba(166,108,255,0.6); }
      100% { text-shadow: 0 0 18px rgba(255, 153, 208, 0.95), 0 0 26px rgba(166,108,255,0.8); }
    }

    .title {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(12px, 1.4vw, 18px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 0 12px rgba(255, 92, 168, 0.6);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="heart-shell">
      <div class="heart" id="heart"></div>
    </div>
    <div class="title">20 Languages of Love</div>
  </div>

  <script>
    const messages = [
      "I love you",
      "Te quiero",
      "Je t'aime",
      "Ich liebe dich",
      "Ti amo",
      "Eu te amo",
      "أحبك",
      "愛してる",
      "사랑해",
      "我爱你",
      "Я тебя люблю",
      "मैं तुमसे प्यार करता हूँ",
      "Seni seviyorum",
      "Ik hou van jou",
      "Jag älskar dig",
      "Kocham cię",
      "ฉันรักคุณ",
      "Mahal kita",
      "Σ'αγαπώ",
      "আমি তোমায় ভালোবাসি"
    ];

    const heart = document.getElementById("heart");

    messages.forEach((msg, index) => {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = msg;

      const t = index / (messages.length - 1);
      const angle = (t * Math.PI * 2) + (index * 0.5);

      const x = 16 * Math.pow(Math.sin(angle), 3);
      const y = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);

      const px = x * 8.2;
      const py = y * 8.2;

      span.style.left = `calc(50% + ${px}px)`;
      span.style.top = `calc(50% - ${py}px)`;
      span.style.setProperty("--delay", `${index * 0.12}s`);
      span.style.setProperty("--dur", `${2.4 + (index % 5) * 0.5}s`);
      span.style.setProperty("--tilt", `${(index % 2 === 0 ? 1 : -1) * (8 + (index % 6))}deg`);

      const hue = 330 + (index * 7) % 50;
      span.style.color = `hsl(${hue}, 90%, 90%)`;

      heart.appendChild(span);
    });
  </script>
</body>
</html>
